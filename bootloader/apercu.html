<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Aperçu — FritaxLoader</title>
<style>
  @font-face {
    font-family: 'JetBrainsMonoFallback';
    src: local('JetBrains Mono'), local('Cascadia Code'), local('Consolas');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #05070a;
    overflow: hidden;
  }

  body {
    font-family: 'JetBrainsMonoFallback', 'Courier New', monospace;
    color: #7ef9c4;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Scanlines + vignette pour effet CRT/BIOS rétro */
  .crt {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 1px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 3px
      );
    z-index: 5;
  }
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    z-index: 6;
  }

  .screen {
    width: 960px;
    max-width: 92vw;
    padding: 48px 56px;
    position: relative;
    z-index: 2;
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-bottom: 6px;
  }

  .logo .hex {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 6px rgba(126,249,196,0.9));
  }

  .logo h1 {
    font-size: 40px;
    letter-spacing: 4px;
    font-weight: 700;
    color: #eafff2;
    text-shadow: 0 0 14px rgba(126,249,196,0.55), 0 0 2px rgba(255,255,255,0.6);
  }

  .logo h1 span { color: #7ef9c4; }

  .subtitle {
    color: #4f9c82;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 40px;
    padding-left: 52px;
  }

  .rule {
    height: 1px;
    background: linear-gradient(to right, rgba(126,249,196,0.7), rgba(126,249,196,0));
    margin-bottom: 34px;
  }

  .menu {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 46px;
  }

  .menu li {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 18px;
    font-size: 17px;
    color: #5fbf95;
    border-left: 3px solid transparent;
    border-radius: 2px;
  }

  .menu li .num {
    color: #2f5f4c;
    font-size: 14px;
    width: 18px;
  }

  .menu li.selected {
    color: #eafff2;
    background: linear-gradient(to right, rgba(126,249,196,0.14), rgba(126,249,196,0));
    border-left: 3px solid #7ef9c4;
    text-shadow: 0 0 10px rgba(126,249,196,0.5);
  }

  .menu li.selected .num { color: #7ef9c4; }

  .menu li .arrow {
    opacity: 0;
    color: #7ef9c4;
    width: 14px;
  }
  .menu li.selected .arrow { opacity: 1; }

  .footer {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: #3d6d59;
    letter-spacing: 1px;
    border-top: 1px solid rgba(126,249,196,0.15);
    padding-top: 18px;
  }

  .footer .keys kbd {
    color: #7ef9c4;
    border: 1px solid #2f5f4c;
    border-radius: 3px;
    padding: 1px 6px;
    margin-right: 4px;
    font-size: 11px;
  }

  .blink {
    display: inline-block;
    width: 9px;
    height: 17px;
    background: #7ef9c4;
    margin-left: 6px;
    vertical-align: -3px;
    animation: blink 1s steps(1) infinite;
    box-shadow: 0 0 8px rgba(126,249,196,0.8);
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .glow-orb {
    position: fixed;
    width: 700px;
    height: 700px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(126,249,196,0.09), rgba(126,249,196,0) 70%);
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="glow-orb"></div>

  <div class="screen">
    <div class="logo">
      <svg class="hex" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,4 93,27 93,73 50,96 7,73 7,27"
          stroke="#7ef9c4" stroke-width="6" fill="rgba(126,249,196,0.08)"/>
        <polygon points="50,26 74,39 74,61 50,74 26,61 26,39"
          stroke="#7ef9c4" stroke-width="4" fill="none" opacity="0.6"/>
      </svg>
      <h1>FRITAX<span>LOADER</span></h1>
    </div>
    <div class="subtitle">v0.1 &nbsp;·&nbsp; BIOS/UEFI &nbsp;·&nbsp; merci à eden :3 💚</div>

    <div class="rule"></div>

    <ul class="menu">
      <li class="selected"><span class="num">01</span><span class="arrow">▸</span> Démarrer Arch Linux — PC-de-Fritax</li>
      <li><span class="num">02</span><span class="arrow">▸</span> Démarrer sur le système de secours</li>
      <li><span class="num">03</span><span class="arrow">▸</span> Options de démarrage avancées</li>
      <li><span class="num">04</span><span class="arrow">▸</span> Paramètres UEFI du firmware</li>
    </ul>

    <div class="footer">
      <span class="keys"><kbd>↑</kbd><kbd>↓</kbd> naviguer &nbsp;&nbsp; <kbd>ENTRÉE</kbd> valider &nbsp;&nbsp; <kbd>E</kbd> éditer</span>
      <span>démarrage auto dans 4s<span class="blink"></span></span>
    </div>
  </div>

  <div class="vignette"></div>
  <div class="crt"></div>

</body>
</html>
