<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <defs>
    <clipPath id="coins"><rect x="0" y="0" width="880" height="560" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#coins)">
    <!-- barre de titre -->
    <rect x="0" y="0" width="880" height="34" fill="#1c1c1c"/>
    <circle cx="18" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="6" fill="#febc2e"/>
    <circle cx="62" cy="17" r="6" fill="#28c840"/>
    <text x="440" y="22" fill="#cfcfcf" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">Fritax Arch Setup</text>

    <!-- panneau lateral -->
    <rect x="0" y="34" width="260" height="526" fill="#1793D1"/>
    <circle cx="130" cy="220" r="55" fill="#ffffff"/>
    <text x="130" y="232" font-family="Segoe UI, sans-serif" font-size="34" text-anchor="middle">🐧</text>
    <text x="130" y="300" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Fritax Arch Setup</text>
    <text x="130" y="326" fill="#dceefb" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Remplace Windows par Arch</text>
    <text x="130" y="342" fill="#dceefb" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Linux, sans clé USB.</text>
    <text x="130" y="530" fill="#bfe0f5" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">© eden &amp; Fritax</text>

    <!-- contenu droite -->
    <rect x="260" y="34" width="620" height="526" fill="#F7F8FA"/>

    <!-- indicateur d'etapes -->
    <rect x="300" y="66" width="360" height="34" rx="17" fill="#ffffff" stroke="#E3E5E8"/>
    <circle cx="322" cy="83" r="10" fill="#1793D1"/>
    <text x="322" y="87" fill="#fff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">1</text>
    <text x="340" y="87" fill="#1B1B1F" font-family="Segoe UI, sans-serif" font-size="11">Informations</text>
    <circle cx="450" cy="83" r="10" fill="#E3E5E8"/>
    <text x="450" y="87" fill="#fff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <text x="468" y="87" fill="#6B7280" font-family="Segoe UI, sans-serif" font-size="11">Installation</text>
    <circle cx="565" cy="83" r="10" fill="#E3E5E8"/>
    <text x="565" y="87" fill="#fff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3</text>
    <text x="583" y="87" fill="#6B7280" font-family="Segoe UI, sans-serif" font-size="11">Terminé</text>

    <!-- titre -->
    <text x="300" y="150" fill="#1B1B1F" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">Coucou :) Bienvenue !  😄</text>
    <text x="300" y="176" fill="#6B7280" font-family="Segoe UI, sans-serif" font-size="13">Vérifie les informations ci-dessous avant de continuer.</text>

    <!-- cartes -->
    <g font-family="Segoe UI, sans-serif">
      <rect x="300" y="200" width="560" height="64" rx="16" fill="#ffffff" stroke="#E3E5E8"/>
      <text x="322" y="222" font-size="14">🖥️</text>
      <text x="350" y="220" fill="#6B7280" font-size="9" font-weight="700">NOM DU PC À INSTALLER</text>
      <text x="350" y="240" fill="#1B1B1F" font-size="14">PC-de-Fritax</text>
      <text x="838" y="238" fill="#6B7280" font-size="12" text-anchor="middle">▾</text>

      <rect x="300" y="274" width="560" height="64" rx="16" fill="#ffffff" stroke="#E3E5E8"/>
      <text x="322" y="296" font-size="14">👤</text>
      <text x="350" y="294" fill="#6B7280" font-size="9" font-weight="700">NOM D'UTILISATEUR</text>
      <text x="350" y="314" fill="#1B1B1F" font-size="14">fritaxdev</text>
      <text x="838" y="312" fill="#6B7280" font-size="12" text-anchor="middle">▾</text>

      <rect x="300" y="348" width="560" height="64" rx="16" fill="#ffffff" stroke="#E3E5E8"/>
      <text x="322" y="370" font-size="14">🚑</text>
      <text x="350" y="368" fill="#6B7280" font-size="9" font-weight="700">SYSTÈME DE SECOURS</text>
      <text x="350" y="388" fill="#1B1B1F" font-size="14">activé</text>
      <text x="838" y="386" fill="#6B7280" font-size="12" text-anchor="middle">▾</text>
    </g>

    <text x="300" y="440" fill="#B45309" font-family="Segoe UI, sans-serif" font-size="11">⚠️  Cette installation REMPLACE COMPLÈTEMENT Windows. Sauvegarde tes fichiers !</text>

    <!-- boutons -->
    <rect x="700" y="500" width="160" height="40" rx="20" fill="#ffffff" stroke="#E3E5E8"/>
    <text x="780" y="525" fill="#1B1B1F" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🔧 Voir les raccourcis</text>
    <rect x="530" y="500" width="160" height="40" rx="20" fill="#1793D1"/>
    <text x="610" y="525" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Commencer ;D)  →</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="559" rx="14" fill="none" stroke="#26292E"/>
</svg>
