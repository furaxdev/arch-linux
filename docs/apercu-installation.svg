<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <defs>
    <clipPath id="coins2"><rect x="0" y="0" width="880" height="560" rx="14"/></clipPath>
    <pattern id="glyphs" width="16" height="16" patternUnits="userSpaceOnUse">
      <text x="0" y="12" fill="#00ff41" font-family="Consolas, monospace" font-size="13" opacity="0.55">ア</text>
    </pattern>
  </defs>
  <g clip-path="url(#coins2)">
    <rect x="0" y="0" width="880" height="560" fill="#000000"/>
    <rect x="0" y="0" width="880" height="560" fill="url(#glyphs)" opacity="0.5"/>
    <!-- colonnes de pluie plus marquées -->
    <g font-family="Consolas, monospace" font-size="15" fill="#00ff41" opacity="0.8">
      <text x="20" y="60">0</text><text x="20" y="80">1</text><text x="20" y="100">ｱ</text>
      <text x="60" y="120">7</text><text x="60" y="140">ｳ</text><text x="60" y="160">3</text>
      <text x="140" y="40">ｵ</text><text x="140" y="60">9</text>
      <text x="220" y="90">ｶ</text><text x="220" y="110">2</text>
      <text x="700" y="70">ｹ</text><text x="700" y="90">5</text>
      <text x="780" y="130">ｺ</text><text x="780" y="150">8</text>
      <text x="820" y="50">4</text><text x="820" y="70">ｻ</text>
      <text x="400" y="450">ｼ</text><text x="400" y="470">6</text>
      <text x="500" y="480">ｽ</text><text x="600" y="460">0</text>
    </g>

    <!-- panneau central -->
    <rect x="140" y="200" width="600" height="160" rx="20" fill="#04120a" stroke="#0a8a2a"/>
    <text x="440" y="245" fill="#00ff41" font-family="Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">Nous installons votre système...</text>
    <text x="440" y="268" fill="#00ff41" font-family="Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">(et dis merci à eden :3) 💚</text>

    <rect x="200" y="290" width="480" height="24" rx="12" fill="none" stroke="#00ff41" stroke-width="2"/>
    <rect x="200" y="290" width="300" height="24" rx="12" fill="#00ff41"/>
    <text x="440" y="336" fill="#00ff41" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">62 %</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="559" rx="14" fill="none" stroke="#26292E"/>
</svg>
