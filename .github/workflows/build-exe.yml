name: 🐧 Build ArchInstallerFritax.exe

on:
  push:
    branches: [main, amd64-x86, intel64-x86, "claude/**"]
    paths:
      - "windows_installer/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Nom de branche sécurisé (sans "/")
        id: branche
        shell: bash
        run: echo "safe=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation de PyInstaller
        working-directory: windows_installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Construction de l'exécutable
        working-directory: windows_installer
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --noupx `
            --version-file version_info.txt `
            --name ArchInstallerFritax `
            ArchInstallerFritax.py

      - name: Publication de l'exécutable (artifact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: ArchInstallerFritax-${{ steps.branche.outputs.safe }}
          path: windows_installer/dist/ArchInstallerFritax.exe
          retention-days: 30

      # Lien de téléchargement public et stable (utilisé par le site vitrine),
      # uniquement pour les branches AMD/Intel (pas pour les branches de dev).
      - name: Publication en tant que GitHub Release (lien public stable)
        if: github.ref_name == 'amd64-x86' || github.ref_name == 'intel64-x86'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-latest
          name: Fritax Arch Setup — ${{ github.ref_name }}
          body: |
            Dernière version compilée automatiquement depuis la branche `${{ github.ref_name }}`.
            Commit : ${{ github.sha }}
          files: windows_installer/dist/ArchInstallerFritax.exe
          make_latest: false
